name: Deploy RescueLink Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RescueLink-dashboard-deploy-v3.zip"
      - "dashboard-clock.js"
      - ".github/workflows/deploy-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract dashboard
        run: unzip -q RescueLink-dashboard-deploy-v3.zip
      - name: Add Philippine time clock
        run: |
          cp dashboard-clock.js dashboard/dist/clock.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path("dashboard/dist/index.html")
          content = page.read_text()
          content = content.replace("</body>", '<script defer src="./clock.js"></script></body>')
          page.write_text(content)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
